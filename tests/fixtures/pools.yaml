# On-chain integration test targets for v4quote AMM math.
#
# Every address below was verified on-chain on 2026-09-21 (and is re-verified by
# tests/onchain/test_address_links.py on every run):
#   * factory / router / quoter addresses come from official sources (see `source`)
#   * each pool address is the value returned by the official factory
#     (getPair / getPool / getAllLBPairs) for the listed tokens and fee;
#     v4 pools are identified by their PoolKey and checked via StateView.getSlot0.
# DexScreener was used only as a hint for which pairs have liquidity.
#
# Schema (one entry per pool):
#   id, chain, dex, type (uniswap_v2 | uniswap_v3 | uniswap_v4 | lfj_lb),
#   pool, quoter, tokens [token0/X, token1/Y], plus type-specific fields.
#   To add pools: append entries with the same schema.

