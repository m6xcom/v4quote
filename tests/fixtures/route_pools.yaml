#
# Source: the DEXes' official contract lists (Avalanche pools and DEX contracts) plus the WAVAX/USDC
# pools already verified in pools.yaml. Pools marked "factory query" were found by querying every
# official factory for the pair (Uniswap v3 getPool fee 100/500/3000/10000, Pharaoh V3 getPool tickSpacing
# 1/5/10/50/100/200, LFJ v2.2 / v2.1 / Pharaoh DLMM getAllLBPairs, LFJ v1 / Uniswap v2 getPair) at Avalanche
# block 95948731 and keeping those holding >= ~$20k (pool token balances x AaveOracle price); TVL in comments.
# Only pools whose math v4quote covers exactly (v2, v3 and exact forks, v4 without swap hooks, LB v2.1/v2.2 incl. Pharaoh DLMM). Blackhole (Algebra), Pharaoh legacy (Solidly) and
# oracle PMMs are not routed (core_supported = false). Every entry is re-verified against its factory by
# test_routing_replay.py::test_route_pool_links. Hooked LB pools are used only if their hook is in
# DEFAULT_HOOKS_ALLOWLIST at the block (otherwise best_route lists them in Route.skipped).
#
# Schema: id, dex, type (uniswap_v2 | uniswap_v3 | uniswap_v4 | lfj_lb), pool (v4: pool_key + pool_id),
# tokens [token0/X, token1/Y] (symbols from `tokens`), factory, quoter, type-specific fields.

