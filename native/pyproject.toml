[project]
name = "v4quote-native"
version = "0.1.0"
description = "Optional native (Rust, pyo3) backend of v4quote's hot AMM math (module v4quote_native); bit-exact with the Python implementation"
license = "GPL-2.0-or-later"
requires-python = ">=3.12"
dependencies = []

[build-system]
# maturin 1.15.0 pinned to the exact PyPI wheel file and its sha256: the build frontend (uv / pip) downloads that file
# and refuses it on a hash mismatch. Pinned wheels: Linux x86_64, Windows x86_64, Linux aarch64; other hosts: add the
# matching wheel line (URL + sha256 from the PyPI JSON API) the same way. The markers are disjoint.
requires = [
    "maturin @ https://files.pythonhosted.org/packages/fe/91/b495e19e2f5c503b540452b2039115e7b2363867e8c5ad4179eb752fa92c/maturin-1.15.0-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.musllinux_1_1_x86_64.whl#sha256=653020a63525bb224e5ab0adf02e17a2e08bc86dbea7fc1399c9a56d7529b99e ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "maturin @ https://files.pythonhosted.org/packages/40/dc/4e90da594986ba78dd3bc8a5921ecdcdb11085b22b02a412caab3b225601/maturin-1.15.0-py3-none-win_amd64.whl#sha256=552c2be4afd43fe8d5c9f3ec8d4c4756d973b8dcbe94c14084390301f50243e1 ; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "maturin @ https://files.pythonhosted.org/packages/5d/2b/2abff58037188d852b124871b1f0d720e1c2bfb3d4f1b03d87c52cd66488/maturin-1.15.0-py3-none-manylinux_2_17_aarch64.manylinux2014_aarch64.musllinux_1_1_aarch64.whl#sha256=0ebf9767892725083138e671c34482c660317a2f3d6a29fc0e0f34e9d8c99136 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
build-backend = "maturin"

[tool.maturin]
module-name = "v4quote_native"
features = ["python", "pyo3/extension-module"]
profile = "release"
locked = true

[tool.uv]
# uv rebuilds a path dependency only when one of these files changes (default: pyproject.toml only)
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "build.rs" }, { file = "src/**/*.rs" }]
